<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/arc-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Arc Quest — The ultimate Web3 adventure game on Arc Testnet. Complete onchain missions, earn XP, mint achievement NFTs, and climb the blockchain-powered leaderboard." />
    <meta name="keywords" content="Arc blockchain, Web3 game, testnet, NFT, DeFi, onchain quests, Arc Quest" />
    <meta property="og:title" content="Arc Quest — Explore Arc Blockchain Through Epic Quests" />
    <meta property="og:description" content="Complete onchain missions, earn XP, mint NFT achievements on Arc Testnet" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#02050a" />
    <title>Arc Quest — Onchain Adventure on Arc Testnet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* ===== CRITICAL CSS — Inlined to prevent FOUC on Vercel ===== */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --neon-blue: #00d4ff;
        --neon-purple: #d400ff;
        --neon-pink: #ff0055;
        --neon-green: #00ff88;
        --neon-gold: #ffd700;
        --bg-primary: #02050a;
        --bg-secondary: #050a14;
        --bg-card: rgba(6, 10, 20, 0.4);
        --bg-card-hover: rgba(10, 18, 35, 0.5);
        --border-glass: rgba(0, 212, 255, 0.2);
        --border-glass-hover: rgba(0, 212, 255, 0.6);
        --text-primary: #ffffff;
        --text-secondary: #8ab4f8;
        --text-muted: #4a6a90;
        --gradient-hero: linear-gradient(135deg, #00d4ff 0%, #d400ff 50%, #ff0055 100%);
        --shadow-neon-blue: 0 0 15px rgba(0,212,255,0.6), 0 0 40px rgba(0,212,255,0.3);
        --shadow-card: 0 16px 40px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.1);
        --radius-sm: 8px;
        --radius-md: 14px;
        --radius-lg: 24px;
        --radius-xl: 32px;
        --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        --transition-fast: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        --font-display: 'Orbitron', monospace;
        --font-body: 'Rajdhani', sans-serif;
        --font-text: 'Inter', sans-serif;
      }

      html { scroll-behavior: smooth; }

      body {
        background: #02050a;
        color: #ffffff;
        font-family: 'Inter', 'Rajdhani', system-ui, sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
        line-height: 1.6;
      }

      #root { min-height: 100vh; background: #02050a; }

      /* Glass card — critical for layout */
      .glass-card {
        background: rgba(6, 10, 20, 0.4);
        backdrop-filter: blur(40px) saturate(200%) contrast(110%);
        -webkit-backdrop-filter: blur(40px) saturate(200%) contrast(110%);
        border: 1px solid rgba(0, 212, 255, 0.2);
        border-radius: 24px;
        box-shadow: 0 16px 40px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.1);
        position: relative;
        overflow: hidden;
        transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .glass-card:hover {
        background: rgba(10, 18, 35, 0.5);
        border-color: rgba(0, 212, 255, 0.6);
        box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 15px rgba(0,212,255,0.6), 0 0 40px rgba(0,212,255,0.3);
        transform: translateY(-6px) scale(1.01);
      }

      /* Gradient text */
      .gradient-text {
        background: linear-gradient(135deg, #00d4ff 0%, #d400ff 50%, #ff0055 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 0 15px rgba(212,0,255,0.4));
      }

      /* Neon text */
      .neon-text-blue {
        color: #fff;
        text-shadow: 0 0 5px #fff, 0 0 15px #00d4ff, 0 0 30px #00d4ff, 0 0 60px rgba(0,212,255,0.6);
      }

      /* Primary button */
      .btn-primary {
        display: inline-flex; align-items: center; justify-content: center; gap: 10px;
        padding: 16px 36px;
        background: linear-gradient(135deg, rgba(0,212,255,0.9) 0%, rgba(0,85,255,0.9) 100%);
        color: #fff; font-family: 'Orbitron', monospace; font-size: 0.95rem;
        font-weight: 800; letter-spacing: 0.2em;
        border: 1px solid rgba(0,212,255,0.8); border-radius: 14px;
        cursor: pointer; text-transform: uppercase; text-decoration: none;
        box-shadow: 0 0 20px rgba(0,212,255,0.4), inset 0 0 20px rgba(0,212,255,0.3);
        transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative; overflow: hidden;
      }
      .btn-primary:hover {
        transform: translateY(-4px) scale(1.02);
        box-shadow: 0 10px 30px rgba(0,212,255,0.6), 0 0 40px rgba(0,212,255,0.4);
        border-color: #fff;
        background: linear-gradient(135deg, rgba(0,230,255,1) 0%, rgba(0,100,255,1) 100%);
      }
      .btn-primary:active { transform: translateY(2px) scale(0.98); }

      /* Secondary button */
      .btn-secondary {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 12px 28px; background: transparent; color: #00d4ff;
        font-family: 'Orbitron', monospace; font-size: 0.85rem;
        font-weight: 600; letter-spacing: 0.1em;
        border: 1px solid #00d4ff; border-radius: 14px;
        cursor: pointer; transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        text-transform: uppercase;
      }
      .btn-secondary:hover {
        background: rgba(0,212,255,0.1);
        box-shadow: 0 0 15px rgba(0,212,255,0.6), 0 0 40px rgba(0,212,255,0.3);
        transform: translateY(-2px);
      }

      .btn-lg { padding: 16px 40px; font-size: 1rem; }
      .btn-sm { padding: 8px 16px; font-size: 0.75rem; }

      /* Tags */
      .tag { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; font-family: 'Orbitron', monospace; letter-spacing: 0.06em; text-transform: uppercase; }
      .tag-blue { background: rgba(0,212,255,0.12); color: #00d4ff; border: 1px solid rgba(0,212,255,0.25); }
      .tag-purple { background: rgba(212,0,255,0.12); color: #cc66ff; border: 1px solid rgba(212,0,255,0.25); }
      .tag-green { background: rgba(0,255,136,0.12); color: #00ff88; border: 1px solid rgba(0,255,136,0.25); }
      .tag-gold { background: rgba(255,215,0,0.12); color: #ffd700; border: 1px solid rgba(255,215,0,0.25); }

      /* Status */
      .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; font-family: 'Orbitron', monospace; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
      .status-connected { background: rgba(0,255,136,0.12); border: 1px solid rgba(0,255,136,0.3); color: #00ff88; }
      .status-disconnected { background: rgba(255,60,60,0.1); border: 1px solid rgba(255,60,60,0.3); color: #ff6060; }

      /* Pulse */
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .glow-dot { width: 8px; height: 8px; border-radius: 50%; background: #00ff88; box-shadow: 0 0 8px #00ff88; animation: pulse 2s infinite; display: inline-block; }

      /* Float */
      @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
      .float { animation: float 4s ease-in-out infinite; }

      /* Progress */
      .progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
      .progress-fill { height: 100%; background: linear-gradient(90deg, #00d4ff, #d400ff); border-radius: 3px; transition: width 0.5s ease; box-shadow: 0 0 10px rgba(0,212,255,0.5); }

      /* Layout */
      .container { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
      .section { padding: 80px 0; }
      .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
      .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
      .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
      @media (max-width: 768px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } }
      @media (max-width: 1024px) { .grid-3 { grid-template-columns: repeat(2, 1fr); } .grid-4 { grid-template-columns: repeat(2, 1fr); } }

      /* Typography */
      h1, h2, h3, h4 { font-family: 'Orbitron', monospace; letter-spacing: 0.05em; }
      h1 { font-size: clamp(1.8rem, 5vw, 3.5rem); }
      h2 { font-size: clamp(1.4rem, 3vw, 2.2rem); }
      h3 { font-size: clamp(1.1rem, 2vw, 1.5rem); }
      p { font-family: 'Rajdhani', sans-serif; font-size: 1.05rem; }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #02050a; }
      ::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.3); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(0,212,255,0.6); }

      /* Divider */
      .divider { width: 100%; height: 1px; background: linear-gradient(90deg, transparent, rgba(0,212,255,0.2), transparent); margin: 24px 0; }

      /* Skeleton */
      @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
      .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; border-radius: 8px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
